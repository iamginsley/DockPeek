name: DockPeek
options:
  bundleIdPrefix: com.iamginsley
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: de
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Configs/Project.xcconfig
  Release: Configs/Project.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DockPeek:
    type: application
    platform: macOS
    sources:
      - path: DockPeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamginsley.dockpeek
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
    entitlements:
      path: DockPeek/Resources/DockPeek.entitlements
      properties:
        # Accessibility + Dock observation do not work inside the App Sandbox.
        com.apple.security.app-sandbox: false
    info:
      path: DockPeek/Resources/Info.plist
      properties:
        CFBundleDisplayName: DockPeek
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Menu bar only: no Dock icon, no main menu.
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 iamginsley"
    scheme: {}
