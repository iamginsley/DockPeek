name: DockPeek
options:
  bundleIdPrefix: com.iamginsley
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: 2567P974L9
    CODE_SIGN_STYLE: Automatic

targets:
  DockPeek:
    type: application
    platform: macOS
    sources:
      - path: DockPeek
    info:
      path: DockPeek/Resources/Info.plist
      properties:
        CFBundleDisplayName: DockPeek
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Dominik Gintsberger"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamginsley.dockpeek
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Reading other apps' windows through Accessibility does not work in the App Sandbox,
        # so DockPeek ships outside the Mac App Store (Developer ID, notarized).
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  DockPeekTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DockPeekTests
    dependencies:
      - target: DockPeek
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DockPeek.app/Contents/MacOS/DockPeek"

schemes:
  DockPeek:
    build:
      targets:
        DockPeek: all
        DockPeekTests: [test]
    run:
      config: Debug
    test:
      targets: [DockPeekTests]
